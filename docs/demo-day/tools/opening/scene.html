<!doctype html><meta charset="utf-8">
<link rel="stylesheet" href="noto.css">
<style>
:root{--ink:#0d0e11;--paper:#f4f1ea;--green:#18c964;--mute:#bdb9b0}
html,body{margin:0;width:1920px;height:1080px;overflow:hidden;background:var(--ink);font-family:'Noto Sans TC',sans-serif}
#stage{position:absolute;inset:0;perspective:1700px;perspective-origin:50% 18%}
#page{position:absolute;left:360px;top:160px;width:1200px;height:760px;background:var(--paper);transform-style:preserve-3d;transform-origin:50% 50%}
.b{position:absolute;transform-style:preserve-3d}
.shadow{position:absolute;background:rgba(13,14,17,.22);border-radius:6px;filter:blur(10px)}
#nav{left:0;top:0;width:1200px;height:70px;display:flex;align-items:center;padding:0 48px;box-sizing:border-box;gap:36px;font-size:20px}
.dull{font-family:Arial,sans-serif;color:#9a9a9a}
.box{background:#d9d6cf}
#fig{position:absolute;transform-origin:50% 100%;transform-style:preserve-3d}
#figshadow{position:absolute;width:130px;height:40px;border-radius:50%;background:rgba(13,14,17,.25);filter:blur(4px)}
#title{position:absolute;left:130px;top:110px;color:var(--paper)}
#title .k{font-size:26px;letter-spacing:.22em;color:var(--green);font-weight:700}
#title .h{font-size:120px;font-weight:900;line-height:1.05;margin-top:22px;letter-spacing:-.01em}
#title .s{font-size:40px;margin-top:26px;color:var(--mute);font-weight:500}
img{display:block;width:100%;height:100%;object-fit:cover}
</style>
<div id="stage"><div id="page"></div></div>
<div id="title"></div>
<script type="importmap">{"imports":{"three":"./three/three.module.js","three/addons/":"./three/examples/jsm/"}}</script>
<script type="module" src="fig3d.js"></script>
<script>
const $=s=>document.querySelector(s);
const clamp=(x,a=0,b=1)=>Math.min(b,Math.max(a,x));
const ease=x=>{x=clamp(x);return x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2};
const seg=(t,a,b)=>ease((t-a)/(b-a));
const lerp=(a,b,k)=>a+(b-a)*k;
const page=$('#page');
function el(id,html,style){const d=document.createElement('div');d.className='b';d.id=id;d.innerHTML=html;Object.assign(d.style,style);page.appendChild(d);return d}
function shadow(){const d=document.createElement('div');d.className='shadow';page.appendChild(d);return d}
// the 3D girl (fig3d.js) in a transparent canvas standing on the floor at her feet
const figWrap=document.createElement('div');figWrap.id='fig';page.appendChild(figWrap);
const fsh=document.createElement('div');fsh.id='figshadow';page.appendChild(fsh);
let yaw=Math.PI/2,lastX=null,lastY=null;
// x,y: her feet on the page; o: { walk, phase, carry, yaw } (yaw forces her facing)
function placeFig(x,y,tilt,o={}){
  if(!figWrap.firstChild)figWrap.appendChild(fig3d.canvas);
  const dx=lastX==null?0:x-lastX,dy=lastY==null?0:y-lastY;lastX=x;lastY=y;
  const moving=Math.hypot(dx,dy)>0.4;
  const target=o.yaw!=null?o.yaw:moving?Math.atan2(dx,dy):yaw;
  const d=Math.atan2(Math.sin(target-yaw),Math.cos(target-yaw));yaw+=d*0.25;
  fig3d.draw(90-tilt,yaw,o.walk!=null?o.walk:(moving?1:0),o.phase||0,o.carry||null);
  figWrap.style.width=fig3d.W+'px';figWrap.style.height=fig3d.H+'px';
  figWrap.style.left=(x-fig3d.W/2)+'px';figWrap.style.top=(y-fig3d.H+fig3d.H*0.12/1.25)+'px';
  figWrap.style.transform=`rotateX(${-tilt}deg)`;
  fsh.style.left=(x-65)+'px';fsh.style.top=(y-20)+'px';
}
// feet position that puts the flat carried board's centre on (cx,cy)
function feetFor(cx,cy,faceYaw,wpx,hpx){const [ox,oy]=fig3d.flatOffset(faceYaw,wpx/fig3d.UNIT,hpx/fig3d.UNIT);return [cx-ox,cy-oy]}
const lin=(t,a,b)=>clamp((t-a)/(b-a));
function setPage(a,s,tx,ty){page.style.transform=`translate(${tx}px,${ty}px) scale(${s}) rotateX(${a}deg)`}
function lift(elm,sh,x,y,w,h,z){elm.style.left=x+'px';elm.style.top=y+'px';elm.style.width=w+'px';elm.style.height=h+'px';elm.style.transform=`translateZ(${z}px)`;
  sh.style.left=(x+z*0.15)+'px';sh.style.top=(y+z*0.3)+'px';sh.style.width=w+'px';sh.style.height=h+'px';sh.style.opacity=clamp(z/24)}
const FLOOR=[56,0.86,250,170];
window.scenes={};
</script>
<script src="intro.js"></script>
<script src="outro.js"></script>
